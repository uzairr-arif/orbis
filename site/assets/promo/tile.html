<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  /* Orbis promo tile, 1080x1080. Brand: ink + emerald, flat, no gradients. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; }
  body {
    font-family: "Segoe UI Variable Text", "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: #0D1110;
    color: #E8EEEB;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .mark { margin-bottom: 48px; }
  h1 {
    font-size: 150px;
    font-weight: 680;
    letter-spacing: -0.035em;
    line-height: 1;
  }
  .tag {
    margin-top: 30px;
    font-size: 40px;
    color: #A9B6B1;
    letter-spacing: -0.01em;
  }
  .chips {
    display: flex;
    gap: 18px;
    margin-top: 64px;
  }
  .chip {
    font-family: ui-monospace, "Cascadia Code", Consolas, "SF Mono", Menlo, monospace;
    font-size: 26px;
    font-weight: 600;
    padding: 14px 30px;
    border-radius: 999px;
    border: 1px solid #232D29;
    background: #0E1312;
  }
  .chip .sq { display: inline-block; width: 14px; height: 14px; border-radius: 3px; margin-right: 12px; }
  .crit .sq { background: #ED6A4D; } .crit { color: #ED6A4D; }
  .high .sq { background: #E1913C; } .high { color: #E1913C; }
  .med .sq { background: #CBB35A; } .med { color: #CBB35A; }
  .cmd {
    margin-top: 64px;
    font-family: ui-monospace, "Cascadia Code", Consolas, "SF Mono", Menlo, monospace;
    font-size: 26px;
    color: #52CFA2;
    padding: 18px 34px;
    border: 1px solid #26302C;
    border-radius: 999px;
    background: #131917;
  }
</style>
</head>
<body>
  <svg class="mark" width="150" height="150" viewBox="0 0 32 32" fill="none">
    <circle cx="16" cy="16" r="6" stroke="#3EC99B" stroke-width="2.2"/>
    <ellipse cx="16" cy="16" rx="13" ry="5.2" stroke="#E8EEEB" stroke-width="2" transform="rotate(-22 16 16)"/>
    <circle cx="28" cy="13.1" r="2.5" fill="#3EC99B"/>
  </svg>
  <h1>Orbis</h1>
  <p class="tag">Security noise in. Actions out.</p>
  <div class="chips">
    <span class="chip crit"><span class="sq"></span>1 critical</span>
    <span class="chip high"><span class="sq"></span>1 high</span>
    <span class="chip med"><span class="sq"></span>6 medium</span>
  </div>
  <div class="cmd">orbis scan --demo</div>
</body>
</html>
