[package]
name = "orbis-cli"
version.workspace = true
edition.workspace = true
description = "Orbis command line interface"

[[bin]]
name = "orbis"
path = "src/main.rs"

[dependencies]
orbis-core = { path = "../orbis-core" }
orbis-scanner = { path = "../orbis-scanner" }
orbis-risk = { path = "../orbis-risk" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
colored = "2"
