[workspace]
resolver = "2"
members = [
    "crates/orbis-core",
    "crates/orbis-scanner",
    "crates/orbis-risk",
    "crates/orbis-cli",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/uzairr-arif/orbis"
homepage = "https://uzairr-arif.github.io/orbis/"
readme = "README.md"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
lto = true
strip = true
