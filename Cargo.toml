[workspace]
resolver = "2"
members = [
    "crates/orbis-core",
    "crates/orbis-scanner",
    "crates/orbis-risk",
    "crates/orbis-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "TBD"
repository = "https://github.com/orbis"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
lto = true
strip = true
